<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 · 도륙 Dor6</title>
  <link rel="icon" href="dor6.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="admin">
  <main class="page">
    <h1 class="page-title">🔒 관리자 패널</h1>
    <p class="page-desc">회장·클럽장·부클럽장 전용. 클럽원 등록/삭제를 수행합니다.</p>

    <!-- 로그인 전 -->
    <div id="login-view" class="card" style="max-width:380px;margin:0 auto;">
      <div class="field">
        <label for="pw">관리자 비밀번호</label>
        <input id="pw" class="input" type="password" autocomplete="current-password" placeholder="비밀번호 입력">
      </div>
      <button id="login-btn" class="btn primary block">로그인</button>
      <div id="login-msg" style="margin-top:var(--sp-3);font-size:var(--fs-sm);"></div>
    </div>

    <!-- 로그인 후 -->
    <div id="admin-view" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-4);">
        <span class="badge ok">로그인됨</span>
        <button id="logout-btn" class="btn">로그아웃</button>
      </div>

      <div class="section-title">➕ 클럽원 등록</div>
      <div class="card">
        <div class="field">
          <label for="new-nick">인게임 닉네임</label>
          <input id="new-nick" class="input" placeholder="예: Dor6문선생">
        </div>
        <div class="field">
          <label for="new-talk">톡방 닉(불릴이름)</label>
          <input id="new-talk" class="input" placeholder="예: 문선생">
        </div>
        <div class="field">
          <label for="new-role">역할</label>
          <select id="new-role" class="input">
            <option value="클럽원">클럽원</option>
            <option value="부클럽장">부클럽장</option>
            <option value="클럽장">클럽장</option>
            <option value="회장">회장</option>
          </select>
        </div>
        <button id="add-btn" class="btn primary block">닉네임 확인 후 등록</button>
        <div id="add-msg" style="margin-top:var(--sp-3);font-size:var(--fs-sm);"></div>
      </div>

      <div class="section-title">🗑 현재 클럽원</div>
      <div id="admin-members" class="card"><div class="loading">불러오는 중…</div></div>
    </div>

    <div id="worker-warn"></div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
