name: 매치 데이터 수집·집계

on:
  schedule:
    - cron: "0 */2 * * *"   # 2시간마다 (UTC 기준). 러너 혼잡 시 수 분 지연 가능(정상)
  workflow_dispatch:          # 수동 실행 버튼

# data/ 에 커밋하기 위한 쓰기 권한
permissions:
  contents: write

# 동시 실행 방지 (겹치면 커밋 충돌)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 수집 실행
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: node scripts/collect.js

      # 플레이스타일 비교 기준(랭커 평균) — 7일 지난 경우에만 실제 조회(약 10분), 실패해도 집계는 계속
      - name: 랭커 기준값 갱신(주 1회)
        continue-on-error: true
        timeout-minutes: 25
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: node scripts/ranker-baseline.js

      - name: 집계 실행
        run: node scripts/aggregate.js

      - name: 변경 사항 커밋
        run: |
          git config user.name "dor6-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "[자동] 매치 데이터 수집·집계 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
