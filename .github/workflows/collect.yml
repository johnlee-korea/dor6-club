name: 매치 데이터 수집·집계

on:
  schedule:
    - cron: "47 */6 * * *"  # 예비용(6시간마다). 정시 실행은 Cloudflare Worker Cron이 2시간마다 workflow_dispatch로 호출(worker/wrangler.toml)
  workflow_dispatch:          # 수동 실행 버튼

# data/ 에 커밋하기 위한 쓰기 권한
permissions:
  contents: write

# 동시 실행 방지 (겹치면 커밋 충돌)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 수집 실행
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: node scripts/collect.js

      # 랭커 기준값은 baseline.yml(주 1회)로 분리 — v2.2.0

      - name: 집계 실행
        run: node scripts/aggregate.js

      - name: 변경 사항 커밋
        run: |
          git config user.name "dor6-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "[자동] 매치 데이터 수집·집계 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # 실행 중 다른 커밋(코드 수정·관리자 명단 등록)이 올라와도 실패하지 않도록 최신 main에 rebase 후 push (최대 3회)
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              git rebase --abort 2>/dev/null; echo "push 재시도 $i/3"; sleep 5
            done
            exit 1
          fi
