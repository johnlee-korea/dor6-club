name: 랭커 기준값 갱신 (주 1회)

# 구단운영(v2.2.0)부터 공식경기·감독모드 두 모드를 조회해 약 15~20분 걸림 → 2시간마다 도는 수집(collect.yml)에서 분리
on:
  schedule:
    - cron: "20 18 * * 0"   # 매주 월요일 03:20 KST
  workflow_dispatch:

permissions:
  contents: write

# 수집 워크플로와 같은 그룹 — 동시에 data/에 커밋하지 않도록
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 7일 지난 경우에만 실제 조회 (config.rankerBaseline.refreshDays)
      - name: 랭커 기준값·xG 표 생성
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: node scripts/ranker-baseline.js
      # 기준값이 바뀌면 명단 플레이스타일·에이스도 다시 계산
      - name: 집계 실행
        run: node scripts/aggregate.js
      - name: 변경 사항 커밋
        run: |
          git config user.name "dor6-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "[자동] 랭커 기준값 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              git rebase --abort 2>/dev/null; echo "push 재시도 $i/3"; sleep 5
            done
            exit 1
          fi
