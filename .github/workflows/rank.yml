name: 등급·순위·점수 기록

# 매시 35분 Cloudflare Worker Cron이 workflow_dispatch로 호출 (worker/wrangler.toml, v2.8.0)
# 데이터센터 랭킹 닉 검색만 사용 → 넥슨 API 키 불필요
on:
  workflow_dispatch:

permissions:
  contents: write

# 수집(collect.yml)·기준값(baseline.yml)과 같은 그룹 → 커밋 충돌 방지
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 등급 기록
        run: node scripts/rank-history.js

      - name: 변경 사항 커밋
        run: |
          git config user.name "dor6-bot"
          git config user.email "actions@github.com"
          git add data/rankhist.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "[자동] 등급 기록 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              git rebase --abort 2>/dev/null; echo "push 재시도 $i/3"; sleep 5
            done
            exit 1
          fi
