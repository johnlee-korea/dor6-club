name: FC온라인 공지 수집

# 하루 1회 FC온라인 공식 홈페이지 공지사항·개발자 노트 → data/notices.json (v2.10.0)
# 홈페이지 HTML만 읽음 → 넥슨 API 키 불필요. 매일 저녁 8시 17분(KST) 전후 — 정기점검 등 중요 공지가 주로 오후에 올라옴(사용자) (GitHub 스케줄은 수십 분 늦을 수 있음)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write

# 수집(collect.yml)·등급 기록(rank.yml)과 같은 그룹 → 커밋 충돌 방지
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 공지 수집
        run: node scripts/notices.js

      - name: 변경 사항 커밋
        run: |
          git config user.name "dor6-bot"
          git config user.email "actions@github.com"
          git add data/notices.json
          # updatedAt만 바뀐 경우도 커밋(화면의 '갱신 시각' 표시용) — 하루 1회라 부담 없음
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "[자동] FC온라인 공지 수집 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              git rebase --abort 2>/dev/null; echo "push 재시도 $i/3"; sleep 5
            done
            exit 1
          fi
